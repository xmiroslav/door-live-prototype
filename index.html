<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Door Live — prototype</title><style>*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#101318;color:white;font:15px system-ui,sans-serif}main{height:100%;height:100dvh;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}header{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#171d25}header b{letter-spacing:.05em}.tag{font-size:11px;color:#9bd5ff}.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(130deg,#303842,#14181e)}video,canvas{position:absolute;width:100%;height:100%;object-fit:cover}canvas{touch-action:none}.hint{position:absolute;top:12px;left:12px;right:12px;text-align:center;pointer-events:none;font-size:12px;background:#101820b8;padding:8px;border-radius:9px}.side{position:absolute;z-index:5;right:12px;top:45%;transform:translateY(-50%);display:grid;gap:9px}.side button,.bottom button,.panel button{border:0;color:white;background:#273545;border-radius:13px;padding:12px;cursor:pointer}.side button{width:48px;height:48px;font-size:22px}.side button.active{background:#177fa7}.bottom{position:absolute;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;padding:12px 12px calc(12px + env(safe-area-inset-bottom, 0px));background:#171d25ee;gap:8px}.bottom button{flex:1}.panel{display:none;position:absolute;z-index:11;bottom:76px;left:10px;right:10px;background:#202833f5;padding:12px 16px 18px;max-height:min(52%,360px);overflow:auto;border:1px solid #526273;border-radius:16px;box-shadow:0 12px 35px #0008}.panel.open{display:block}.options{display:flex;gap:9px;flex-wrap:wrap;margin:8px 0 14px}.options button{border:1px solid #4d5c69;font-size:13px}.options button.selected{border:2px solid #76d5fa;background:#31526a}h4{margin:8px 0}small{color:#b8c5d1}input[type=file]{display:none}@media(max-height:600px){.hint{font-size:11px}.side{top:42%}.side button{width:44px;height:44px}.panel{max-height:48%}} </style></head><body><main><header><b>DOOR <span style="color:#62d4ff">LIVE</span></b><span class="tag">V0.3 · MOBILE FIX</span></header><div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas><div class="hint" id="hint">Включи камеру → нажми ◎ для поиска проёма или установи углы вручную.</div><div class="side"><button id="edit" title="Цвет, ручка, окно" aria-label="Открыть настройки двери">⚙</button><button id="auto" title="Найти дверной проём">◎</button><button id="track" title="Отслеживание">◉</button><button id="reset" title="Сброс углов">⌗</button></div></div><section class="panel" id="panel"><h4>Цвет двери</h4><div class="options" id="colors"></div><h4>Ручка</h4><div class="options" id="handles"></div><h4>Окно</h4><div class="options" id="windows"></div><small>Все изменения видны сразу. Размеры и цены пока не рассчитываются.</small></section><div class="bottom"><button id="start">📷 Камера</button><button id="upload">▧ Фото</button><button id="save">↓ Снимок</button><input type="file" id="file" accept="image/*"></div></main><script>
const stage=document.getElementById('stage'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),video=document.getElementById('video'),panel=document.getElementById('panel');let stream=null,photo=null,points=null,drag=-1,style={color:'#394650',handle:'silver',window:'top'};const palette=[['Графит','#394650'],['Белый','#e9e5da'],['Дерево','#946542'],['Чёрный','#15191c'],['Синий','#244b75']];function initPoints(){const w=canvas.width,h=canvas.height;points=[[w*.26,h*.14],[w*.74,h*.14],[w*.74,h*.87],[w*.26,h*.87]]}function resize(){const r=stage.getBoundingClientRect(),old=points;canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);if(old){const sx=canvas.width/(resize.oldW||canvas.width),sy=canvas.height/(resize.oldH||canvas.height);points=old.map(p=>[p[0]*sx,p[1]*sy])}else initPoints();resize.oldW=canvas.width;resize.oldH=canvas.height;draw()}window.addEventListener('resize',resize);
function renderDoor(){const c=document.createElement('canvas');c.width=420;c.height=840;const x=c.getContext('2d');x.fillStyle=style.color;x.fillRect(0,0,420,840);x.strokeStyle='#0008';x.lineWidth=12;x.strokeRect(9,9,402,822);x.strokeStyle='#ffffff20';x.lineWidth=3;x.strokeRect(29,29,362,782);if(style.window!=='none'){let wx=style.window==='slim'?270:66,wy=style.window==='slim'?65:65,ww=style.window==='slim'?72:288,wh=style.window==='slim'?440:270;x.fillStyle='#7c9ba9';x.fillRect(wx,wy,ww,wh);x.strokeStyle='#12181f';x.lineWidth=16;x.strokeRect(wx,wy,ww,wh);x.strokeStyle='#c7e7ff66';x.lineWidth=6;x.beginPath();x.moveTo(wx+15,wy+wh-20);x.lineTo(wx+ww-18,wy+20);x.stroke()}x.fillStyle=style.handle==='black'?'#111':style.handle==='gold'?'#c3a15a':'#c9d1d6';x.fillRect(315,440,12,98);x.fillRect(270,443,57,12);return c}
function triMap(img,src,dst){const [a,b,c]=src,[d,e,f]=dst;const det=(a[0]*(b[1]-c[1])+b[0]*(c[1]-a[1])+c[0]*(a[1]-b[1]));if(Math.abs(det)<.01)return;const solve=(v)=>[(v[0]*(b[1]-c[1])+v[1]*(c[1]-a[1])+v[2]*(a[1]-b[1]))/det,(v[0]*(c[0]-b[0])+v[1]*(a[0]-c[0])+v[2]*(b[0]-a[0]))/det,(v[0]*(b[0]*c[1]-c[0]*b[1])+v[1]*(c[0]*a[1]-a[0]*c[1])+v[2]*(a[0]*b[1]-b[0]*a[1]))/det];const xx=solve([d[0],e[0],f[0]]),yy=solve([d[1],e[1],f[1]]);ctx.save();ctx.beginPath();ctx.moveTo(...d);ctx.lineTo(...e);ctx.lineTo(...f);ctx.closePath();ctx.clip();ctx.setTransform(xx[0],yy[0],xx[1],yy[1],xx[2],yy[2]);ctx.drawImage(img,0,0);ctx.restore()}
function draw(){if(!canvas.width)return;const w=canvas.width,h=canvas.height;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,w,h);const source=photo||((video.readyState>=2)?video:null);if(source){const sw=source.videoWidth||source.naturalWidth,sh=source.videoHeight||source.naturalHeight;if(sw&&sh){const s=Math.max(w/sw,h/sh),dw=sw*s,dh=sh*s;ctx.drawImage(source,(w-dw)/2,(h-dh)/2,dw,dh)}}else{ctx.fillStyle='#26313a';ctx.fillRect(0,0,w,h);ctx.fillStyle='#9caab5';ctx.textAlign='center';ctx.font=`${16*devicePixelRatio}px system-ui`;ctx.fillText('Включи камеру или загрузи фото',w/2,h/2)}const img=renderDoor(),p=points,src=[[0,0],[420,0],[420,840],[0,840]];const N=12;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const at=(u,v)=>{let a=[p[0][0]*(1-u)+p[1][0]*u,p[0][1]*(1-u)+p[1][1]*u],b=[p[3][0]*(1-u)+p[2][0]*u,p[3][1]*(1-u)+p[2][1]*u];return [a[0]*(1-v)+b[0]*v,a[1]*(1-v)+b[1]*v]};let a=at(x/N,y/N),b=at((x+1)/N,y/N),c=at((x+1)/N,(y+1)/N),d=at(x/N,(y+1)/N),sa=[420*x/N,840*y/N],sb=[420*(x+1)/N,840*y/N],sc=[420*(x+1)/N,840*(y+1)/N],sd=[420*x/N,840*(y+1)/N];triMap(img,[sa,sb,sc],[a,b,c]);triMap(img,[sa,sc,sd],[a,c,d])}ctx.setTransform(1,0,0,1,0,0);ctx.strokeStyle='#7fe0ff';ctx.lineWidth=2*devicePixelRatio;ctx.setLineDash([5*devicePixelRatio,4*devicePixelRatio]);ctx.beginPath();ctx.moveTo(...p[0]);p.slice(1).forEach(q=>ctx.lineTo(...q));ctx.closePath();ctx.stroke();ctx.setLineDash([]);p.forEach((q,i)=>{ctx.beginPath();ctx.arc(q[0],q[1],8*devicePixelRatio,0,Math.PI*2);ctx.fillStyle=i===drag?'#fdd477':'#fff';ctx.fill();ctx.strokeStyle='#167ba4';ctx.lineWidth=2*devicePixelRatio;ctx.stroke()})}
function loop(){if(stream&&!photo)draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function pos(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}canvas.addEventListener('pointerdown',e=>{const p=pos(e);let dist=Infinity;points.forEach((q,i)=>{const d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<dist){dist=d;drag=i}});if(dist>65*devicePixelRatio)drag=-1;else canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag<0)return;points[drag]=pos(e);draw()});['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,()=>drag=-1));document.getElementById('edit').onclick=()=>panel.classList.toggle('open');document.getElementById('reset').onclick=()=>{initPoints();draw()};document.getElementById('start').onclick=async()=>{try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;photo=null;video.style.display='block';document.getElementById('hint').textContent='Перетащи четыре угла на реальный дверной проём';draw()}catch(e){alert('Камера недоступна. Для доступа нужен HTTPS или localhost, а также разрешение браузера. '+e.message)}};document.getElementById('upload').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{photo=im;video.style.display='none';draw();URL.revokeObjectURL(url)};im.src=url};document.getElementById('save').onclick=()=>{draw();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='door-preview.png';a.click()};function choices(id,arr,key){const el=document.getElementById(id);arr.forEach(([label,value])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{style[key]=value;el.querySelectorAll('button').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');draw()};if(style[key]===value)b.classList.add('selected');el.appendChild(b)})}choices('colors',palette,'color');choices('handles',[['Серебро','silver'],['Чёрная','black'],['Золото','gold']],'handle');choices('windows',[['Без окна','none'],['Верхнее','top'],['Узкое','slim']],'window');resize();

// V0.2: local edge-based rectangle proposal + image patch optical tracking.
const autoBtn=document.getElementById('auto'),trackBtn=document.getElementById('track'),hint=document.getElementById('hint');
let tracking=false,previous=null,trackTick=0,trackingScore=0,found=false;
const probe=document.createElement('canvas');probe.width=240;probe.height=320;
const pc=probe.getContext('2d',{willReadFrequently:true});
function captureGray(){
 const w=probe.width,h=probe.height,source=photo||((video.readyState>=2)?video:null);
 if(!source)return null;
 const sw=source.videoWidth||source.naturalWidth,sh=source.videoHeight||source.naturalHeight;
 if(!sw||!sh)return null;
 const scale=Math.max(w/sw,h/sh),dw=sw*scale,dh=sh*scale;
 pc.clearRect(0,0,w,h);pc.drawImage(source,(w-dw)/2,(h-dh)/2,dw,dh);
 const rgba=pc.getImageData(0,0,w,h).data,out=new Uint8Array(w*h);
 for(let i=0;i<out.length;i++)out[i]=(rgba[i*4]*77+rgba[i*4+1]*150+rgba[i*4+2]*29)>>8;
 return out;
}
function gradients(gray){
 const w=probe.width,h=probe.height,vertical=new Float32Array(w),horizontal=new Float32Array(h);
 for(let y=12;y<h-12;y+=2)for(let x=12;x<w-12;x+=2){
  const i=y*w+x;
  vertical[x]+=Math.abs(gray[i+2]-gray[i-2]);
  horizontal[y]+=Math.abs(gray[i+2*w]-gray[i-2*w]);
 }
 for(let i=2;i<w-2;i++)vertical[i]=(vertical[i-2]+2*vertical[i-1]+3*vertical[i]+2*vertical[i+1]+vertical[i+2])/9;
 for(let i=2;i<h-2;i++)horizontal[i]=(horizontal[i-2]+2*horizontal[i-1]+3*horizontal[i]+2*horizontal[i+1]+horizontal[i+2])/9;
 return {vertical,horizontal};
}
function findOpening(){
 const gray=captureGray();if(!gray){hint.textContent='Сначала включи камеру или загрузи фотографию';return;}
 const {vertical,horizontal}=gradients(gray),w=probe.width,h=probe.height;
 let best=null,bestScore=-Infinity;
 // Candidate rectangle scored by long straight vertical and horizontal image edges.
 for(let left=12;left<w*.57;left+=4)for(let right=Math.max(left+60,Math.floor(w*.48));right<w-12;right+=4){
  const width=right-left;if(width<65||width>210)continue;
  for(let top=10;top<h*.43;top+=7)for(let bottom=Math.max(top+115,Math.floor(h*.58));bottom<h-8;bottom+=7){
   const height=bottom-top,ratio=height/width;if(ratio<1.3||ratio>3.6)continue;
   const score=(vertical[left]+vertical[right])*.8+(horizontal[top]+horizontal[bottom])*.42- Math.abs((left+right)/2-w/2)*1.5;
   if(score>bestScore){bestScore=score;best=[left,top,right,bottom]}
  }
 }
 if(!best)return;
 const [l,t,r,b]=best,sx=canvas.width/w,sy=canvas.height/h;
 points=[[l*sx,t*sy],[r*sx,t*sy],[r*sx,b*sy],[l*sx,b*sy]];
 found=true;previous=gray;tracking=true;trackBtn.classList.add('active');
 hint.textContent='Предложен проём. Проверь углы и поправь их пальцем, если нужно.';
 draw();
}
function patchScore(a,b,x,y,dx,dy){
 const w=probe.width,h=probe.height;let score=0,count=0;
 for(let yy=-7;yy<=7;yy+=2)for(let xx=-7;xx<=7;xx+=2){
  const px=x+xx,py=y+yy,qx=px+dx,qy=py+dy;
  if(px<1||py<1||px>=w-1||py>=h-1||qx<1||qy<1||qx>=w-1||qy>=h-1)return Infinity;
  score+=Math.abs(a[py*w+px]-b[qy*w+qx]);count++;
 }
 return score/count;
}
function updateTracking(){
 if(!tracking||photo||!stream||drag>=0)return;
 const current=captureGray();if(!current)return;
 if(!previous){previous=current;return;}
 const w=probe.width,h=probe.height,sx=canvas.width/w,sy=canvas.height/h;
 let shifts=[],scores=[];
 // Sample several points along the frame, not the virtual door interior.
 const anchors=[...points, ...[0,1,2,3].map(i=>[(points[i][0]+points[(i+1)%4][0])/2,(points[i][1]+points[(i+1)%4][1])/2])];
 for(const anchor of anchors){
  const x=Math.round(anchor[0]/sx),y=Math.round(anchor[1]/sy);if(x<22||x>w-22||y<22||y>h-22)continue;
  let best=Infinity,dxBest=0,dyBest=0;
  for(let dy=-10;dy<=10;dy+=2)for(let dx=-10;dx<=10;dx+=2){const v=patchScore(previous,current,x,y,dx,dy);if(v<best){best=v;dxBest=dx;dyBest=dy}}
  if(best<29){shifts.push([dxBest,dyBest]);scores.push(best)}
 }
 if(shifts.length>=3){
  const median=(values)=>values.sort((a,b)=>a-b)[Math.floor(values.length/2)];
  const dx=median(shifts.map(a=>a[0])),dy=median(shifts.map(a=>a[1]));
  const coherent=shifts.filter(a=>Math.hypot(a[0]-dx,a[1]-dy)<7).length;
  if(coherent>=3){points=points.map(p=>[Math.max(0,Math.min(canvas.width,p[0]+dx*sx)),Math.max(0,Math.min(canvas.height,p[1]+dy*sy))]);trackingScore=coherent/shifts.length;hint.textContent='◉ Отслеживание: '+Math.round(trackingScore*100)+'% согласованных точек · при необходимости поправь углы';}
  else hint.textContent='Отслеживание неуверенное — удерживай камеру ровно или нажми ◎';
 }else hint.textContent='Проём потерян. Наведи камеру обратно или нажми ◎';
 previous=current;draw();
}
autoBtn.onclick=findOpening;
trackBtn.onclick=()=>{tracking=!tracking;previous=captureGray();trackBtn.classList.toggle('active',tracking);hint.textContent=tracking?'Отслеживание включено. Проверь положение углов.':'Отслеживание остановлено. Углы можно двигать вручную.'};
const originalCamera=document.getElementById('start').onclick;
document.getElementById('start').onclick=async()=>{await originalCamera();previous=null;tracking=false;trackBtn.classList.remove('active')};
const originalUpload=document.getElementById('file').onchange;
document.getElementById('file').onchange=e=>{tracking=false;trackBtn.classList.remove('active');previous=null;originalUpload(e)};
const originalReset=document.getElementById('reset').onclick;
document.getElementById('reset').onclick=()=>{tracking=false;previous=null;trackBtn.classList.remove('active');originalReset()};
canvas.addEventListener('pointerup',()=>{previous=captureGray()});
setInterval(()=>{if(stream&&!photo&&tracking)updateTracking()},120);
</script></body></html>
