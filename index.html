 const p=points.map(q=>[q[0]*sx,q[1]*sy]);
 // Seed features along both jambs and the lintel, including nearby texture.
 for(let i=0;i<4;i++){
  const a=p[i],b=p[(i+1)%4];
  for(let j=0;j<=24;j++){
   const t=j/24,x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
   cv.circle(mask,new cv.Point(Math.round(x),Math.round(y)),13,new cv.Scalar(255),-1);
  }
 }
 const corners=new cv.Mat();
 cv.goodFeaturesToTrack(frame,corners,110,.012,5,mask,5,false,.04);
 mask.delete();
 if(corners.rows<12){corners.delete();frame.delete();return false}
 cvLast=frame;cvFeatures=corners;return true;
}
function trackCV(gray){
 if(!cvReady||cvBusy||!tracking||!points)return false;
 cvBusy=true;let current=null,next=null,status=null,errors=null,H=null,src=null,dst=null,inlierMask=null;
 try{
  if(!cvLast||!cvFeatures){seedCV(gray);return false}
  current=cvFrame(gray);next=new cv.Mat();status=new cv.Mat();errors=new cv.Mat();
  cv.calcOpticalFlowPyrLK(cvLast,current,cvFeatures,next,status,errors,new cv.Size(21,21),3,
   new cv.TermCriteria(cv.TermCriteria_COUNT+cv.TermCriteria_EPS,25,.025));
  const a=[],b=[];
  for(let i=0;i<cvFeatures.rows;i++){
   if(!status.data[i]||errors.data32F[i]>28)continue;
   a.push(cvFeatures.data32F[2*i],cvFeatures.data32F[2*i+1]);
   b.push(next.data32F[2*i],next.data32F[2*i+1]);
  }
  if(a.length<18){lostFrames+=2;resetCV();return false}
  src=cv.matFromArray(a.length/2,1,cv.CV_32FC2,a);
  dst=cv.matFromArray(b.length/2,1,cv.CV_32FC2,b);
  inlierMask=new cv.Mat();
  H=cv.findHomography(src,dst,cv.RANSAC,3,inlierMask,1500,.995);
  if(H.empty()){lostFrames++;return false}
  let count=0;for(let i=0;i<inlierMask.rows;i++)count+=inlierMask.data[i]?1:0;
  if(count<8||count/(a.length/2)<.65){lostFrames++;return false}
  const d=H.data64F.length?H.data64F:H.data32F;
  const sx=probe.width/canvas.width,sy=probe.height/canvas.height;
  const projected=points.map(q=>{
   const x=q[0]*sx,y=q[1]*sy,z=d[6]*x+d[7]*y+d[8];
   return [(d[0]*x+d[1]*y+d[2])/z/sx,(d[3]*x+d[4]*y+d[5])/z/sy];
  });
  if(projected.some((q,i)=>!Number.isFinite(q[0])||!Number.isFinite(q[1])||Math.hypot(q[0]-points[i][0],q[1]-points[i][1])>canvas.width*.12)){lostFrames++;return false}
  // Reject mirrored, collapsed or implausibly warped quadrilaterals.
  const polygonArea=q=>q.reduce((v,p,i)=>v+p[0]*q[(i+1)%4][1]-q[(i+1)%4][0]*p[1],0)/2;
  const oldArea=polygonArea(points),newArea=polygonArea(projected);
  if(oldArea*newArea<=0||Math.abs(newArea/oldArea)<.72||Math.abs(newArea/oldArea)>1.38){lostFrames++;return false}
  const lengths=projected.map((p,i)=>Math.hypot(p[0]-projected[(i+1)%4][0],p[1]-projected[(i+1)%4][1]));
  if(Math.min(...lengths)<20*devicePixelRatio){lostFrames++;return false}
  points=points.map((q,i)=>[q[0]*.22+projected[i][0]*.78,q[1]*.22+projected[i][1]*.78]);
  lostFrames=0;hint.textContent='Отслеживание изображения · проверь положение двери';
  cvLast.delete();cvFeatures.delete();cvLast=current;current=null;cvFeatures=next;next=null;
  if(cvFeatures.rows<18)seedCV(gray);
  draw();return true;
 }catch(e){console.warn('OpenCV tracking error',e);resetCV();return false}
 finally{
  for(const m of [current,next,status,errors,H,src,dst,inlierMask])if(m)m.delete();
  cvBusy=false;
 }
}
function updateTracking(){
 if(!tracking||photo||!stream||drag>=0)return;
 const current=captureGray();if(!current)return;
 if(cvReady){if(trackCV(current)){previous=current;return}if(lostFrames>=8){tracking=false;found=false;resetCV();hint.textContent='Привязка потеряна. Коснись проёма для восстановления.';draw();return}previous=current;return}
 if(!previous){previous=current;return}
 const w=probe.width,h=probe.height,sx=canvas.width/w,sy=canvas.height/h;
 const p=points.map(q=>[q[0]/sx,q[1]/sy]);
 // Use dense frame-adjacent features; corner pixels alone are often blank.
 const anchors=[];
 for(let edge=0;edge<4;edge++){
  const a=p[edge],b=p[(edge+1)%4];
  for(let j=1;j<=7;j++){
   const t=j/8,x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
   for(const offset of [-7,7]){
    const nx=-(b[1]-a[1]),ny=b[0]-a[0],len=Math.hypot(nx,ny)||1;
    anchors.push([x+offset*nx/len,y+offset*ny/len]);
   }
  }
 }
 const matches=[];
 for(const [x0,y0] of anchors){
  const x=Math.round(x0),y=Math.round(y0);if(x<20||x>w-20||y<20||y>h-20)continue;
  let texture=0;
  for(let oy=-5;oy<=5;oy+=2)for(let ox=-5;ox<=5;ox+=2){
   const k=(y+oy)*w+x+ox;
   texture+=Math.abs(previous[k+2]-previous[k-2])+Math.abs(previous[k+2*w]-previous[k-2*w]);
  }
  if(texture<220)continue;
  let best=Infinity,dxBest=0,dyBest=0,second=Infinity;
  for(let dy=-12;dy<=12;dy+=3)for(let dx=-12;dx<=12;dx+=3){
   const v=patchScore(previous,current,x,y,dx,dy);
   if(v<best){second=best;best=v;dxBest=dx;dyBest=dy}else if(v<second)second=v;
  }
  const coarseX=dxBest,coarseY=dyBest;
  for(let dy=coarseY-2;dy<=coarseY+2;dy++)for(let dx=coarseX-2;dx<=coarseX+2;dx++){
   const v=patchScore(previous,current,x,y,dx,dy);
   if(v<best){best=v;dxBest=dx;dyBest=dy}
  }
  if(best<20)matches.push({x:x0,y:y0,dx:dxBest,dy:dyBest,error:best});
 }
 const median=arr=>{const a=arr.slice().sort((x,y)=>x-y);return a[Math.floor(a.length/2)]};
 if(matches.length>=12){
  const mx=median(matches.map(m=>m.dx)),my=median(matches.map(m=>m.dy));
  const inliers=matches.filter(m=>Math.hypot(m.dx-mx,m.dy-my)<4.5);
  if(inliers.length>=10&&inliers.length/matches.length>=.55){
   const cx=inliers.reduce((a,m)=>a+m.x,0)/inliers.length,cy=inliers.reduce((a,m)=>a+m.y,0)/inliers.length;
   const nx=inliers.reduce((a,m)=>a+m.x+m.dx,0)/inliers.length,ny=inliers.reduce((a,m)=>a+m.y+m.dy,0)/inliers.length;
   let denom=0,real=0,imag=0;
   for(const m of inliers){
    const x=m.x-cx,y=m.y-cy,X=m.x+m.dx-nx,Y=m.y+m.dy-ny;
    denom+=x*x+y*y;real+=x*X+y*Y;imag+=x*Y-y*X;
   }
   const scale=Math.hypot(real,imag)/Math.max(1,denom),angle=Math.atan2(imag,real);
   if(scale>.95&&scale<1.05&&Math.abs(angle)<.07&&Math.hypot(nx-cx,ny-cy)<18){
    const co=Math.cos(angle)*scale,si=Math.sin(angle)*scale;
    const proposed=p.map(q=>{const x=q[0]-cx,y=q[1]-cy;return[nx+co*x-si*y,ny+si*x+co*y]});
    points=points.map((q,i)=>[
     Math.max(0,Math.min(canvas.width,q[0]*.35+proposed[i][0]*sx*.65)),
     Math.max(0,Math.min(canvas.height,q[1]*.35+proposed[i][1]*sy*.65))
    ]);
    lostFrames=0;
    hint.textContent='Отслеживание изображения · проверь положение двери';
   }else lostFrames++;
  }else lostFrames++;
 }else lostFrames++;
 if(lostFrames>=8){
  tracking=false;found=false;previous=null;
  hint.textContent='Привязка потеряна. Коснись проёма для нового поиска.';
 }else previous=current;
 draw();
}
autoBtn.onclick=()=>{resetCV();tracking=false;found=false;manualLock=false;selectedByTap=false;targetCenter=null;previous=null;hint.textContent='Коснись центра нужного дверного проёма.';draw()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream){resetCV();stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;hint.textContent='Камера остановлена. Нажми «Камера», чтобы продолжить.'}});const originalCamera=document.getElementById('start').onclick;
document.getElementById('start').onclick=async()=>{resetCV();await originalCamera();previous=null;tracking=false;found=false;selectedByTap=false;targetCenter=null;lostFrames=0;lastSearch=0;if(stream){hint.textContent='Коснись центра дверного проёма или нажми ◎ для поиска.'}};
const originalUpload=document.getElementById('file').onchange;
document.getElementById('file').onchange=e=>{resetCV();tracking=false;previous=null;found=true;originalUpload(e)};

canvas.addEventListener('pointerup',()=>{if(wasDragging){wasDragging=false;return}if(!found)return;resetCV();manualLock=true;tracking=!!stream;previous=captureGray();lostFrames=0;if(cvReady&&previous&&stream)seedCV(previous)});
let processing=false;
setInterval(()=>{if(!stream||photo||drag>=0||manualAdjusting||document.hidden||processing)return;processing=true;try{if(tracking)updateTracking();/* Manual tap or ◎ starts acquisition; no expensive background scans. */}catch(e){console.error('Tracking failed',e);tracking=false;hint.textContent='Ошибка отслеживания. Коснись проёма повторно.'}finally{processing=false}},700);

</script></body></html>
