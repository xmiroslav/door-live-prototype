document.getElementById('file').onchange=e=>{tracking=false;previous=null;originalUpload(e)};

canvas.addEventListener('pointerup',()=>{if(drag>=0)return;manualLock=true;found=true;tracking=true;previous=captureGray();lostFrames=0;hint.textContent='Положение скорректировано. Отслеживание продолжается.'});
setInterval(()=>{if(!stream||photo||drag>=0||document.hidden)return;if(tracking)updateTracking();else if(!found&&Date.now()-lastSearch>2500){lastSearch=Date.now();findOpening()}},260);

</script></body></html>
